name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    # The repository and its rvt-rs fork side by side, as in development:
    # rvt-viewer/ and rvt-rs/ (wasm/Cargo.toml depends on ../../rvt-rs).
    defaults:
      run:
        working-directory: rvt-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: rvt-viewer
          persist-credentials: false

      - name: Read the pinned rvt-rs
        id: rvt-rs
        run: |
          echo "repository=$(sed -n 's/^repository=//p' rvt-rs.ref)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit=//p' rvt-rs.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout rvt-rs (the pinned commit of the fork)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ steps.rvt-rs.outputs.repository }}
          ref: ${{ steps.rvt-rs.outputs.commit }}
          path: rvt-rs
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: rvt-viewer/wasm -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0  # v2.87.22
        with:
          tool: wasm-pack@0.15.0

      - name: Build rvt-rs WebAssembly
        run: bash scripts/build-wasm.sh

      - name: Verify the wasm imports no network APIs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wabt
          if wasm-objdump -j Import -x src/wasm/pkg/rvt_bg.wasm | \
               grep -iE '"(fetch|XMLHttpRequest|WebSocket|EventSource|sendBeacon)"'; then
            echo "::error::the wasm imports a network primitive"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          package_json_file: rvt-viewer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: rvt-viewer/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm exec vite build

      - name: Browser tests (home, PWA install/offline)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: rvt-viewer/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
